# Configuration Jekyll pour Natacha Laure Voyance
# Ne modifie ce fichier que si tu sais ce que tu fais

title: Natacha Laure Voyance
description: Voyante spécialiste du Tarot de Marseille à Nice et par téléphone
url: https://natachalaurevoyance.fr
baseurl: ""

# ⚠ NE JAMAIS remettre _posts, _layouts ou _includes dans « include ».
# Jekyll les traite déjà tout seul : _posts via la collection ci-dessous,
# _layouts et _includes quand une page les appelle. Les lister ici lui
# demandait EN PLUS de publier les fichiers bruts, ce qui créait 26 pages
# fantômes — dont une copie de chaque article de blog, concurrente du vrai
# article aux yeux de Google.
include:
  - admin

# ─────────────────────────────────────────────────────────────────
#  TIRAGE EN CROIX & PRÉCOMMANDE DU JEU  —  à remplir par Natacha
# ─────────────────────────────────────────────────────────────────
# Le formulaire du tirage en croix part sur ce Formspree (le même que
# le formulaire de contact de la page d'accueil).
formspree_id: "mvzerbkz"

# QUE SE PASSE-T-IL QUAND LES CINQ CARTES SONT RETOURNÉES ?
#   "formulaire" → RÉGLAGE EN PLACE. La croix tirée sur la page compte
#                  vraiment : la personne écrit sa question juste en
#                  dessous, tu reçois les cinq cartes dans l'ordre par
#                  e-mail, et le bouton de règlement apparaît aussitôt.
#                  Aucun détour, aucun second tirage.
#   "aurea"      → l'ancien parcours : le bouton renvoie vers
#                  /lecture-de-tirage/ et la personne retire ses cartes
#                  dans l'application.
# Change juste le mot entre guillemets, rien d'autre à toucher.
croix_parcours: "formulaire"

# Lecture écrite du tirage en croix. Les deux prix sont affichés
# ensemble (29 € barré, 10 € en gros) : mets lecture_prix_barre à ""
# pour faire disparaître le prix barré quand l'offre de lancement
# sera terminée.
lecture_prix: 10
lecture_prix_barre: 29

# Lien de paiement Stripe pour cette lecture écrite.
# TANT QUE C'EST VIDE : l'étape de paiement n'apparaît pas du tout, et
# le message de confirmation dit que tu réponds avec le lien. Dès que
# tu colles un lien ici, le bouton « Régler » apparaît après l'envoi.
stripe_lecture: "https://buy.stripe.com/fZudR90EddqneYae07fMA03"

# ── Précommande du jeu animalier ──
# Les quatre clés doivent être remplies pour que le bloc s'affiche.
# S'il en manque une seule, la section reste invisible sur le site :
# comme ça, rien de bancal n'est montré aux visiteurs.
deck_prix: 50
deck_stripe: ""        # ex. https://buy.stripe.com/xxxxxxxx
deck_expedition: ""    # ex. « Printemps 2027 » (le mot « Expédition » est déjà affiché)
deck_livraison: ""     # ex. « France métropolitaine incluse » (le mot « Livraison » est déjà affiché)

# Permaliens : URLs propres pour les articles
permalink: /blog/:slug/

# Collections : les articles de blog
collections:
  posts:
    output: true
    permalink: /blog/:slug/

# Variables par défaut pour tous les articles
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
# Parser Markdown
markdown: kramdown
highlighter: rouge
# Plugins (déjà supportés par GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Exclure ces dossiers/fichiers du build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  # ⚠ Notes techniques internes : NE JAMAIS les publier.
  # Les jokers ci-dessous valent pour tout fichier déposé plus tard : si un
  # A-LIRE ou un LISEZ-MOI atterrit par mégarde dans le dépôt, il ne
  # deviendra pas une page du site. C'est exactement ce qui était arrivé à
  # A-LIRE-COMPTEURS.md, publié et envoyé à Google sans qu'on le veuille.
  - "LISEZ-MOI*.md"
  - "A-LIRE*.md"
  - "A-LIRE*.txt"
  - MODIF-INDEX-HTML.md
  # Copies de téléchargement laissées dans le dépôt. À supprimer aussi sur
  # GitHub ; en attendant, elles ne seront plus publiées.
  - "index (1).html"
  - "index (2).html"
  - "carte-cadeau (1).html"
  - "reserver (1).html"
