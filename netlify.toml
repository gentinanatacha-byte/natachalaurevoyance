# Configuration Netlify pour Natacha Laure Voyance
# Ce fichier indique à Netlify comment build et déployer le site

[build]
  publish = "_site"
  command = "jekyll build"

[build.environment]
  JEKYLL_ENV = "production"
  RUBY_VERSION = "3.1.4"

# Redirection : forcer HTTPS
[[redirects]]
  from = "http://natachalaurevoyance.fr/*"
  to = "https://natachalaurevoyance.fr/:splat"
  status = 301
  force = true

# Redirection www → non-www
[[redirects]]
  from = "https://www.natachalaurevoyance.fr/*"
  to = "https://natachalaurevoyance.fr/:splat"
  status = 301
  force = true

# Cache pour les assets statiques (perf)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
