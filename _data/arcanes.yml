# Les 22 arcanes majeurs du jeu fait maison de Natacha (deck animalier).
# `id` = le préfixe du fichier image dans /assets/cartes/ (00 → 21).
# Les noms sont ceux de SON jeu, pas ceux de la tradition marseillaise :
# son XIII s'appelle « La Mort » (le Marseille le laisse sans nom) et son XVI
# « La Tour » (le Marseille dit « La Maison Dieu »). On garde les siens.
#
# Aucune interprétation ici : le tirage révèle la carte, la lecture vient
# de Natacha.

