u sens. Sa parole a du poids et les autres viennent la chercher.",ecueil:"Dogmatisme, jugement, vie men\xE9e selon un mod\xE8le qu'on n'a jamais choisi.",h:"Cherche un ma\xEEtre ou en devient un. Le risque est de vivre selon les valeurs d'un autre en croyant qu'elles sont les siennes.",f:"Prend naturellement la place de conseil et de rep\xE8re moral du groupe. Le risque est de tenir la morale des autres \xE0 la place de la sienne.",q:"Cette r\xE8gle-l\xE0, elle est de vous ou de quelqu'un d'autre ?",c:"Trier ce qui rel\xE8ve de sa foi et ce qui rel\xE8ve de l'h\xE9ritage."},6:{noyau:"Choix \xB7 lien \xB7 d\xE9sir \xB7 ambivalence",force:"Capacit\xE9 de lien peu commune. Chaleur, sinc\xE9rit\xE9, vrai talent pour aimer.",ecueil:"Ind\xE9cision. Ne tranche pas, et laisse les circonstances ou les autres choisir \xE0 sa place.",h:"Souvent partag\xE9 entre deux liens, deux vies, deux loyaut\xE9s. L'\xE9cueil est l'attente passive que la situation se d\xE9noue seule.",f:"Donne beaucoup et attend d'\xEAtre choisie. L'\xE9cueil est l\xE0 : attendre d'\xEAtre choisie plut\xF4t que de choisir.",q:"Si personne ne devait jamais le savoir, vous choisiriez quoi ?",c:"Choisir, m\xEAme imparfaitement. Rester au carrefour co\xFBte plus cher que se tromper de route."},7:{noyau:"\xC9lan \xB7 conqu\xEAte \xB7 mouvement \xB7 r\xE9ussite visible",force:"Avance, entra\xEEne les autres, gagne. Va au-devant au lieu d'attendre.",ecueil:"Fuite en avant. Deux chevaux qui tirent en sens contraire. Ne s'arr\xEAte jamais assez pour regarder o\xF9 il va.",h:"Le statut et la r\xE9ussite comme moteur. L'\xE9cueil est de confondre vitesse et direction.",f:"Souvent celle qui a d\xFB partir : changer de ville, de m\xE9tier, tout reprendre \xE0 z\xE9ro. L'\xE9cueil est de ne jamais poser les bagages.",q:"Vous allez vers quoi \u2014 ou vous fuyez quoi ?",c:"Nommer la destination avant d'acc\xE9l\xE9rer encore."},8:{noyau:"\xC9quilibre \xB7 mesure \xB7 v\xE9rit\xE9 \xB7 dette",force:"Droiture, clart\xE9, capacit\xE9 \xE0 trancher. Sait ce qui est juste et le dit.",ecueil:"Froideur, besoin d'avoir raison, comptes anciens qu'on ne solde jamais.",h:"Rapport fort \xE0 la r\xE8gle, au contrat, \xE0 la parole donn\xE9e. L'\xE9cueil est de juger avant d'avoir compris.",f:"M\xE9moire tr\xE8s fine des torts subis, jusqu'au d\xE9tail. L'\xE9cueil est de porter des comptes anciens qui l'alourdissent bien plus qu'ils ne la prot\xE8gent.",q:"Qu'est-ce qui n'a jamais \xE9t\xE9 r\xE9par\xE9 ?",c:"Solder une chose \u2014 ou l'abandonner franchement. Les deux valent mieux que la garder ouverte."},9:{noyau:"Retrait \xB7 lenteur \xB7 qu\xEAte \xB7 solitude",force:"Profondeur, lucidit\xE9, autonomie. Avance lentement mais ne recule jamais.",ecueil:"Isolement, m\xE9fiance, tristesse qui s'installe sans bruit. Le temps qui passe sans qu'on le voie.",h:"Solitude d'abord choisie, puis subie. L'\xE9cueil est de confondre ind\xE9pendance et fermeture.",f:"Souvent une longue p\xE9riode de vie en retrait \u2014 deuil, maladie, maternit\xE9, \xE9loignement. L'\xE9cueil est de croire que le moment est pass\xE9.",q:"Depuis quand \xEAtes-vous seul(e) avec \xE7a ?",c:"Une porte entrouverte suffit. Il ne s'agit pas de l'ouvrir en grand."},10:{noyau:"Cycles \xB7 retournements \xB7 ce qui \xE9chappe",force:"Rebondit, sent le moment, saisit l'occasion quand elle passe.",ecueil:"Passivit\xE9 d\xE9guis\xE9e en patience. Attend que \xE7a tourne. D\xE9pend des circonstances et des autres.",h:"Go\xFBt du risque et des coups. L'\xE9cueil est de miser au lieu de construire.",f:"Vie en montagnes russes, souvent au rythme des d\xE9cisions de quelqu'un d'autre. L'\xE9cueil est d'attendre que \xE7a tourne plut\xF4t que de le faire tourner.",q:"La derni\xE8re fois que \xE7a a tourn\xE9, vous y \xE9tiez pour quelque chose ?",c:"Poser un geste concret pendant le haut du cycle, pas apr\xE8s."},11:{noyau:"Ma\xEEtrise douce \xB7 courage \xB7 apprivoisement",force:"R\xE9sistance tranquille. Courage sans violence. Endurance que les autres ne soup\xE7onnent pas.",ecueil:"\xC9touffe ses propres pulsions. Encaisse tout, longtemps, en silence.",h:"Une force qui doit apprendre la douceur. L'\xE9cueil est le contr\xF4le exerc\xE9 par la puissance plut\xF4t que par la pr\xE9sence.",f:"Une force qu'on ne lui reconna\xEEt pas, et qu'elle finit par ne plus revendiquer. L'\xE9cueil est d'encaisser jusqu'\xE0 la rupture nette.",q:"Qu'est-ce que vous tenez \xE0 bout de bras sans jamais le dire ?",c:"Apprivoiser, pas \xE9craser. Et poser ce qui p\xE8se, au moins un moment."},12:{noyau:"Suspension \xB7 retournement \xB7 attente \xB7 autre point de vue",force:"Recul, l\xE2cher-prise, capacit\xE9 \xE0 voir la situation \xE0 l'envers \u2014 donc juste.",ecueil:"Paralysie. Sacrifice qui ne sert \xE0 rien et que personne n'a demand\xE9.",h:"Sentiment d'avoir mis sa vie entre parenth\xE8ses pour un travail, une famille, une dette. L'\xE9cueil est le renoncement pr\xE9sent\xE9 comme une vertu.",f:"Sacrifice tellement normalis\xE9 par l'entourage que plus personne ne le voit. L'\xE9cueil est d'attendre une reconnaissance qui ne viendra pas.",q:"Vous attendez que quoi, exactement ?",c:"Fixer une date de fin \xE0 l'attente. Une vraie date."},13:{noyau:"Fin n\xE9cessaire \xB7 nettoyage \xB7 mue",force:"Sait couper, faire le vide, recommencer. Ne s'encombre pas de ce qui est mort.",ecueil:"Coupe pour couper. Ou \xE0 l'inverse : peur panique du changement, deuil jamais fait.",h:"Coupe net et ne revient pas. L'\xE9cueil est de couper avant d'avoir compris ce qu'il coupait.",f:"Garde tr\xE8s longtemps, puis rompt d'un coup et sans retour. L'\xE9cueil est le deuil diff\xE9r\xE9, qui revient plus tard et plus fort.",q:"Qu'est-ce qui est d\xE9j\xE0 mort et que vous gardez quand m\xEAme ?",c:"Enterrer avant de replanter. Dans cet ordre."},14:{noyau:"Circulation \xB7 apaisement \xB7 juste dose \xB7 lien",force:"R\xE9concilie, soigne, fait circuler. Trouve le bon tempo l\xE0 o\xF9 les autres forcent.",ecueil:"Ti\xE9deur. Arrondit les angles jusqu'\xE0 s'effacer compl\xE8tement du tableau.",h:"Le pacificateur de service. L'\xE9cueil est d'\xE9viter l'affrontement qui, lui, \xE9tait n\xE9cessaire.",f:"Le liant de la famille : tout passe par elle. L'\xE9cueil est d'\xEAtre le tuyau par lequel tout circule sans jamais rien garder pour soi.",q:"\xC0 qui n'avez-vous jamais os\xE9 dire non ?",c:"Un conflit assum\xE9 vaut mieux que dix conflits \xE9vit\xE9s."},15:{noyau:"D\xE9sir \xB7 attachement \xB7 puissance \xB7 talent brut",force:"Magn\xE9tisme, \xE9nergie vitale, cr\xE9ativit\xE9 sans filtre. Ne s'interdit rien, et c'est parfois exactement ce qu'il faut.",ecueil:"D\xE9pendance, emprise, lien dont on conna\xEEt la nocivit\xE9 et qu'on garde. Argent, d\xE9sir, pouvoir.",h:"App\xE9tit et pouvoir. L'\xE9cueil est l'emprise \u2014 exerc\xE9e ou subie, souvent dans le travail.",f:"Passion difficile \xE0 rompre, et lucidit\xE9 totale sur ce qu'elle co\xFBte. L'\xE9cueil est pr\xE9cis\xE9ment l\xE0 : elle sait, et elle reste.",q:"Qu'est-ce que vous n'arrivez pas \xE0 quitter ?",c:"Nommer la cha\xEEne \xE0 voix haute. Sur la carte, elle n'est pas ferm\xE9e."},16:{noyau:"Rupture brutale \xB7 lib\xE9ration \xB7 v\xE9rit\xE9 qui \xE9clate",force:"Repart de z\xE9ro sans n\xE9gocier. La v\xE9rit\xE9 sort, m\xEAme mal, et l'air redevient respirable.",ecueil:"Crise \xE0 r\xE9p\xE9tition. Tout casser d\xE8s que \xE7a devient stable.",h:"Effondrement professionnel ou financier, souvent plus d'une fois. L'\xE9cueil est de reb\xE2tir exactement la m\xEAme tour.",f:"Rupture conjugale ou familiale brutale. L'\xE9cueil est de porter la faute alors que la structure \xE9tait d\xE9j\xE0 fissur\xE9e.",q:"Qu'est-ce qui est tomb\xE9 \u2014 et qu'avez-vous reb\xE2ti \xE0 l'identique ?",c:"Ne pas reconstruire sur les m\xEAmes fondations."},17:{noyau:"Espoir \xB7 don \xB7 vocation \xB7 g\xE9n\xE9rosit\xE9",force:"Confiance, inspiration, dons naturels. Apaise les autres rien qu'en \xE9tant l\xE0.",ecueil:"Na\xEFvet\xE9. Se donne sans compter, et r\xEAve au lieu d'agir.",h:"Un don ou une vocation qu'il ne prend pas au s\xE9rieux. L'\xE9cueil est le talent laiss\xE9 en jach\xE8re par modestie mal plac\xE9e.",f:"Donne beaucoup, se prot\xE8ge peu. L'\xE9cueil est l'\xE9puisement par g\xE9n\xE9rosit\xE9 \u2014 et la stupeur quand plus personne ne rend.",q:"Qu'est-ce que vous faites tr\xE8s bien et que vous ne facturez jamais ?",c:"Se donner \xE0 soi une part de ce qu'on donne aux autres."},18:{noyau:"Imaginaire \xB7 \xE9motions \xB7 nuit \xB7 origines",force:"Sensibilit\xE9 et intuition hors norme. M\xE9moire des origines, imagination fertile.",ecueil:"Illusion, angoisse, rumination. Secrets de famille qui p\xE8sent sans \xEAtre nomm\xE9s.",h:"Rapport compliqu\xE9 \xE0 la m\xE8re ou aux origines. L'\xE9cueil est de prendre ses peurs pour des faits \xE9tablis.",f:"Intuition tr\xE8s forte, souvent disqualifi\xE9e par l'entourage depuis l'enfance. L'\xE9cueil est de ne plus savoir distinguer l'intuition de l'anxi\xE9t\xE9.",q:"C'est un pressentiment, ou c'est une peur ?",c:"Attendre le jour pour d\xE9cider. La nuit ment."},19:{noyau:"Clart\xE9 \xB7 joie \xB7 fraternit\xE9 \xB7 ce qui se voit",force:"Chaleur, sinc\xE9rit\xE9, capacit\xE9 \xE0 r\xE9unir. Les autres se sentent bien pr\xE8s de lui.",ecueil:"Besoin d'\xEAtre vu. D\xE9pendance \xE0 l'approbation. Reste parfois dans l'enfance.",h:"La r\xE9ussite visible comme preuve de valeur. L'\xE9cueil est de vivre pour le regard des autres.",f:"Le soleil de la famille, celle qui tient l'ambiance. L'\xE9cueil est de ne jamais s'autoriser \xE0 montrer l'ombre.",q:"Qui vous a vraiment vu(e) cette ann\xE9e ?",c:"Se montrer aussi les jours o\xF9 \xE7a ne brille pas."},20:{noyau:"Appel \xB7 renaissance \xB7 bilan \xB7 r\xE9paration",force:"Se rel\xE8ve. Entend un appel et change de vie pour de bon, m\xEAme tard.",ecueil:"Se juge sans fin. Attend un signal qui ne vient jamais. Culpabilit\xE9 ancienne.",h:"Bascule de carri\xE8re ou de vie, souvent tardive. L'\xE9cueil est d'attendre une permission que personne ne donnera.",f:"Reprise de quelque chose d'interrompu \u2014 \xE9tudes, m\xE9tier, lien coup\xE9. L'\xE9cueil est de se croire trop tard.",q:"Qu'est-ce que vous avez laiss\xE9 en chemin et qui vous rappelle encore ?",c:"R\xE9pondre \xE0 l'appel, m\xEAme en retard. Surtout en retard."},21:{noyau:"Accomplissement \xB7 ouverture \xB7 place trouv\xE9e",force:"Aboutit, relie, s'ouvre au large. Prend sa place quand elle est l\xE0.",ecueil:"N'estime jamais \xEAtre arriv\xE9. Repousse la ligne d'arriv\xE9e \xE0 chaque fois qu'il l'atteint.",h:"R\xE9ussite large, satisfaction absente. L'\xE9cueil est de d\xE9placer le but d\xE8s qu'il est atteint.",f:"Une vie qui s'ouvre souvent apr\xE8s une longue p\xE9riode d'enfermement. L'\xE9cueil est de ne pas s'autoriser \xE0 en profiter.",q:"\xC0 quoi ressemblerait \xAB c'est bon, j'y suis \xBB ?",c:"Reconna\xEEtre ce qui est d\xE9j\xE0 accompli avant d'ajouter la suite."},22:{noyau:"Libert\xE9 \xB7 marche \xB7 errance \xB7 sans attache",force:"Libert\xE9 vraie, spontan\xE9it\xE9, capacit\xE9 \xE0 tout quitter sans calcul. Ne triche pas.",ecueil:"Instabilit\xE9. Rien ne dure, rien ne s'enracine. Part avant que \xE7a devienne s\xE9rieux.",h:"D\xE9parts successifs, difficult\xE9 \xE0 se fixer. L'\xE9cueil est de partir avant d'\xEAtre quitt\xE9.",f:"Une libert\xE9 qu'elle paie socialement plus cher. L'\xE9cueil est de finir par se croire inapte \xE0 durer.",q:"Qu'est-ce qui vous ferait rester ?",c:"Une attache choisie n'est pas une cha\xEEne. C'est m\xEAme le contraire."}},$c=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);function Ro(){let e=new Date;return`${e.getFullYear()}-${String(e.getMonth()+1).padStart(2,"0")}-${String(e.getDate()).padStart(2,"0")}`}function Sf(){let e=new Date;return`${String(e.getHours()).padStart(2,"0")}:${String(e.getMinutes()).padStart(2,"0")}`}function Ue(e,n=!0){if(!e)return"";let[t,r,l]=e.split("-").map(Number);retur @import url('https://fonts.googleapis.com/css2?family=Marcellus&family=Archivo:wght@400;500;600&display=swap');

.rv * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.rv {
  --papier: #EDE7DA;
  --papier-clair: #F7F3E9;
  --encre: #241D14;
  --encre-pale: #6E6252;
  --bleu: #2C5075;
  --bleu-fonce: #1B3550;
  --vermillon: #B8382C;
  --ocre: #C1902B;
  --chair: #E3C0A9;
  --trait: #CBBFA8;

  font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  background: var(--papier);
  color: var(--encre);
  min-height: 100vh;
  max-width: 560px;
  margin: 0 auto;
  position: relative;
  padding-bottom: 92px;
  font-size: 15px;
  line-height: 1.5;
}
.rv h1, .rv h2, .rv h3, .rv .titre {
  font-family: 'Marcellus', Georgia, 'Times New Roman', serif;
  font-weight: 400;
  letter-spacing: .01em;
  margin: 0;
}

/* ---- en-t\xEAte ---- */
.rv-entete {
  padding: 22px 20px 16px;
  border-bottom: 1px solid var(--trait);
  background: var(--papier-clair);
}
.rv-entete h1 { font-size: 27px; line-height: 1.1; }
.rv-entete p { margin: 5px 0 0; font-size: 13px; color: var(--encre-pale); }

/* ---- corps ---- */
.rv-corps { padding: 18px 16px 24px; }
.rv-section + .rv-section { margin-top: 26px; }
.rv-section > h2 {
  font-size: 18px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--trait);
  margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
}
.rv-section > h2 span { font-family: 'Archivo', sans-serif; font-size: 12px; color: var(--encre-pale); }

/* ---- fiches ---- */
.rv-fiche {
  background: var(--papier-clair);
  border: 1px solid var(--trait);
  padding: 13px 14px;
  display: block; width: 100%; text-align: left;
  font: inherit; color: inherit; cursor: pointer;
}
.rv-fiche + .rv-fiche { margin-top: 9px; }
.rv-fiche:active { background: #EFE9DC; }
.rv-fiche-nom { font-family: 'Marcellus', Georgia, serif; font-size: 17px; }
.rv-fiche-detail { font-size: 13px; color: var(--encre-pale); margin-top: 3px; }
.rv-ligne { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.rv-montant { font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rv-du { color: var(--vermillon); }

/* ---- bandeau d'alerte ---- */
.rv-alerte {
  border-left: 4px solid var(--vermillon);
  background: #F7EDE9;
  padding: 12px 14px;
  margin-bottom: 18px;
  font-size: 14px;
}
.rv-alerte strong { color: var(--vermillon); }

/* ---- plaque d'arcane ---- */
.rv-arcane {
  border: 1px solid var(--encre);
  box-shadow: 0 0 0 2px var(--papier-clair), 0 0 0 3px var(--encre);
  background: var(--papier-clair);
  width: 62px; flex: 0 0 62px;
  text-align: center;
  padding: 7px 3px 6px;
}
.rv-arcane .num {
  font-family: 'Marcellus', Georgia, serif;
  font-size: 17px; color: var(--vermillon); line-height: 1;
}
.rv-arcane .nom {
  font-family: 'Marcellus', Georgia, serif;
  font-size: 9.5px; line-height: 1.15; margin-top: 5px;
  color: var(--bleu-fonce); word-break: break-word;
}
.rv-arcane.mini { width: 44px; flex: 0 0 44px; padding: 5px 2px 4px; box-shadow: 0 0 0 2px var(--papier), 0 0 0 3px var(--encre); }
.rv-arcane.mini .num { font-size: 13px; }
.rv-arcane.mini .nom { font-size: 7.5px; margin-top: 3px; }

/* ---- \xE9tiquettes ---- */
.rv-etiq {
  display: inline-block; font-size: 11.5px; padding: 2px 8px;
  border: 1px solid var(--trait); background: var(--papier);
  margin: 3px 5px 0 0; color: var(--encre-pale);
}
.rv-etiq.bleu { border-color: var(--bleu); color: var(--bleu); }
.rv-etiq.rouge { border-color: var(--vermillon); color: var(--vermillon); }
.rv-etiq.ocre { border-color: var(--ocre); color: #8A6614; }

/* ---- boutons ---- */
.rv-bouton {
  font: inherit; font-size: 15px; cursor: pointer;
  padding: 13px 18px; border: 1px solid var(--bleu-fonce);
  background: var(--bleu-fonce); color: var(--papier-clair);
  width: 100%;
}
.rv-bouton:active { background: var(--bleu); }
.rv-bouton.creux { background: transparent; color: var(--bleu-fonce); }
.rv-bouton.danger { background: transparent; border-color: var(--vermillon); color: var(--vermillon); }
.rv-bouton.petit { padding: 9px 13px; font-size: 13.5px; width: auto; }
.rv-boutons { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 14px; }
.rv-boutons > * { flex: 1 1 auto; }

/* ---- champs ---- */
.rv-champ { margin-bottom: 15px; }
.rv-champ label { display: block; font-size: 12.5px; color: var(--encre-pale); margin-bottom: 5px; }
.rv-champ input, .rv-champ select, .rv-champ textarea {
  font: inherit; font-size: 16px; width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--trait); background: var(--papier-clair);
  color: var(--encre); border-radius: 0; appearance: none;
}
.rv-champ textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.rv-champ select { background-image: none; }
.rv input:focus, .rv select:focus, .rv textarea:focus, .rv button:focus-visible {
  outline: 2px solid var(--ocre); outline-offset: 1px;
}
.rv-duo { display: flex; gap: 11px; }
.rv-duo > * { flex: 1; min-width: 0; }

.rv-puces { display: flex; flex-wrap: wrap; gap: 7px; }
.rv-puce {
  font: inherit; font-size: 13.5px; cursor: pointer;
  padding: 8px 12px; border: 1px solid var(--trait);
  background: var(--papier-clair); color: var(--encre-pale);
}
.rv-puce[aria-pressed="true"] {
  border-color: var(--bleu-fonce); background: var(--bleu-fonce); color: var(--papier-clair);
}

/* ---- recherche ---- */
.rv-recherche {
  width: 100%; font: inherit; font-size: 16px; padding: 12px 14px;
  border: 1px solid var(--trait); background: var(--papier-clair);
  margin-bottom: 14px; border-radius: 0;
}

/* ---- barre du bas ---- */
.rv-barre {
  position: fixed; bottom: 0; left: 0; right: 0;
  max-width: 560px; margin: 0 auto;
  display: flex; background: var(--papier-clair);
  border-top: 1px solid var(--trait);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 40;
}
.rv-barre button {
  flex: 1; font: inherit; font-size: 11.5px; cursor: pointer;
  background: none; border: none; color: var(--encre-pale);
  padding: 11px 2px 13px; border-top: 3px solid transparent; margin-top: -1px;
}
.rv-barre button[aria-current="page"] { color: var(--bleu-fonce); border-top-color: var(--ocre); }
.rv-barre .glyphe { display: block; font-family: 'Marcellus', Georgia, serif; font-size: 19px; line-height: 1.2; }

/* ---- bouton d'ajout ---- */
.rv-ajout {
  position: fixed; bottom: 78px; right: 50%; transform: translateX(258px);
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--vermillon); color: #fff; border: none;
  font-size: 28px; line-height: 1; cursor: pointer; z-index: 41;
  box-shadow: 0 3px 10px rgba(36,29,20,.28);
  font-family: 'Marcellus', Georgia, serif;
}
@media (max-width: 560px) { .rv-ajout { right: 18px; transform: none; } }

/* ---- panneau plein \xE9cran ---- */
.rv-voile {
  position: fixed; inset: 0; background: rgba(36,29,20,.5);
  z-index: 50; display: flex; justify-content: center; align-items: flex-end;
}
.rv-panneau {
  background: var(--papier); width: 100%; max-width: 560px;
  max-height: 94vh; overflow-y: auto;
  border-top: 3px solid var(--encre);
  animation: rv-monte .22s ease-out;
}
@keyframes rv-monte { from { transform: translateY(26px); opacity: .6 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .rv-panneau { animation: none } }
.rv-panneau-tete {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 16px 18px; border-bottom: 1px solid var(--trait);
  position: sticky; top: 0; background: var(--papier); z-index: 2;
}
.rv-panneau-tete h2 { font-size: 20px; }
.rv-fermer {
  background: none; border: none; font: inherit; font-size: 15px;
  color: var(--encre-pale); cursor: pointer; padding: 6px 2px;
}
.rv-panneau-corps { padding: 18px; }

/* ---- vide ---- */
.rv-vide {
  text-align: center; padding: 40px 22px; color: var(--encre-pale);
  border: 1px dashed var(--trait); font-size: 14px;
}
.rv-vide p { margin: 0 0 14px; }

/* ---- chiffres ---- */
.rv-grandnombre {
  font-family: 'Marcellus', Georgia, serif;
  font-size: 40px; line-height: 1; color: var(--bleu-fonce);
  font-variant-numeric: tabular-nums;
}
.rv-stats { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
.rv-stat {
  flex: 1 1 40%; border-top: 2px solid var(--trait); padding-top: 9px;
}
.rv-stat b { font-family: 'Marcellus', Georgia, serif; font-size: 22px; font-weight: 400; display: block; }
.rv-stat span { font-size: 12px; color: var(--encre-pale); }
.rv-jauge { height: 9px; background: #DDD4C2; margin-top: 5px; }
.rv-jauge i { display: block; height: 100%; background: var(--bleu); }
.rv-navmois { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.rv-navmois button {
  font: inherit; background: var(--papier-clair); border: 1px solid var(--trait);
  padding: 8px 15px; cursor: pointer; color: var(--encre);
}
.rv-navmois .mois { font-family: 'Marcellus', Georgia, serif; font-size: 18px; }

.rv-note {
  font-size: 13.5px; color: var(--encre-pale);
  border-left: 2px solid var(--trait); padding-left: 11px;
  white-space: pre-wrap; margin-top: 8px;
}
.rv-sep { border: none; border-top: 1px solid var(--trait); margin: 22px 0; }
.rv-mini { font-size: 12px; color: var(--encre-pale); }

/* ---- fiches d'arcanes ---- */
.rv-arcane-bouton { background: none; border: none; padding: 0; cursor: pointer; display: block; }
.rv-arcane-bouton:active { opacity: .7; }
.rv-duo-bloc { display: flex; border: 1px solid var(--trait); background: var(--papier-clair); }
.rv-duo-bloc > div { flex: 1; padding: 12px 13px; }
.rv-duo-bloc > div + div { border-left: 1px solid var(--trait); }
@media (max-width: 430px) {
  .rv-duo-bloc { display: block; }
  .rv-duo-bloc > div + div { border-left: none; border-top: 1px solid var(--trait); }
}
.rv-intitule { font-size: 12px; color: var(--encre-pale); margin-bottom: 4px; }
.rv-intitule.b { color: var(--bleu); }
.rv-intitule.r { color: var(--vermillon); }
.rv-genre {
  border: 1px solid var(--trait); border-top: none;
  background: #F1EBDD; padding: 12px 13px;
}
.rv-genre h4 {
  font-family: 'Marcellus', Georgia, serif; font-weight: 400;
  font-size: 14px; color: var(--bleu-fonce); margin: 0 0 4px;
}
.rv-question {
  border-left: 3px solid var(--ocre); padding: 11px 13px; margin-top: 14px;
  background: var(--papier-clair);
}
.rv-question p {
  font-family: 'Marcellus', Georgia, serif; font-size: 16.5px;
  color: var(--bleu-fonce); margin: 4px 0 0; line-height: 1.4;
}
.rv-corpuscule { font-size: 14px; margin: 0; }
